name: Dockcross CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OCI_EXE: docker

jobs:
  base:
    name: base
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: build
        run: make base

      - name: test
        run: make base.test

      - name: archive base
        run: |
          mkdir -p cache
          docker save ghcr.io/loong64/dockcross/base:latest | xz -e6 -T0 > ./cache/base.tar.xz

      - name: save base
        uses: actions/upload-artifact@v7
        with:
          name: cache
          path: ./cache
          retention-days: 3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: deploy
        if: github.ref == 'refs/heads/master'
        run: |
            docker image push ghcr.io/loong64/dockcross/base --all-tags

  images:
    needs: [base]
    runs-on: ${{ matrix.os }}
    env:
      OCI_EXE: docker
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        arch_name:
          # Linux loongarch64 images
          - {
              image: "linux-loongarch64",
              stockfish: "yes",
              stockfish_arg: "ARCH=loongarch64",
              ninja: "yes",
              ninja_arg: "",
              openssl: "yes",
              openssl_arg: "linux64-loongarch64",
              C: "yes",
              C_arg: "-DCMAKE_C_FLAGS=-Wno-incompatible-pointer-types",
              C-Plus-Plus: "yes",
              C-Plus-Plus_arg: "",
              fmt: "yes",
              fmt_arg: "",
              cpython: "yes",
              cpython_arg: "--host=loongarch64-unknown-linux-gnu --target=loongarch64-unknown-linux-gnu",
            }
          - {
              image: "linux-loongarch64-lts",
              stockfish: "yes",
              stockfish_arg: "ARCH=loongarch64",
              ninja: "yes",
              ninja_arg: "",
              openssl: "yes",
              openssl_arg: "linux64-loongarch64",
              C: "yes",
              C_arg: "-DCMAKE_C_FLAGS=-Wno-incompatible-pointer-types",
              C-Plus-Plus: "yes",
              C-Plus-Plus_arg: "",
              fmt: "yes",
              fmt_arg: "",
              cpython: "yes",
              cpython_arg: "--host=loongarch64-unknown-linux-gnu --target=loongarch64-unknown-linux-gnu",
            }
          - {
              image: "linux-loongarch64-musl",
              stockfish: "yes",
              stockfish_arg: "ARCH=loongarch64",
              ninja: "yes",
              ninja_arg: "",
              openssl: "yes",
              openssl_arg: "linux64-loongarch64",
              C: "yes",
              C_arg: "-DCMAKE_C_FLAGS=-Wno-incompatible-pointer-types",
              C-Plus-Plus: "yes",
              C-Plus-Plus_arg: "",
              fmt: "yes",
              fmt_arg: "",
              cpython: "yes",
              cpython_arg: "--host=loongarch64-linux-musl --target=loongarch64-linux-musl",
            }
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: actions/download-artifact@v8
        with:
          name: cache
          path: ./cache

      - name: load base
        run: xz -d -k < ./cache/base.tar.xz | docker load

      - name: build
        run: |
          make ${{ matrix.arch_name.image }}

      - name: basic test
        run: |
          make ${{ matrix.arch_name.image }}.test

      # Updated on 15/07/2025
      - name: stockfish build test
        if: ${{ matrix.arch_name.stockfish == 'yes' }}
        run: |
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish
          ./../tools/dockcross-make-builder.sh ${{ matrix.arch_name.image }} -C src net
          ./../tools/dockcross-make-builder.sh ${{ matrix.arch_name.image }} -C src build ${{ matrix.arch_name.stockfish_arg }} -j${nproc}
          cd ..
          rm -rf Stockfish

      # Updated on 12/09/2022
      - name: ninja build test
        if: ${{ matrix.arch_name.ninja == 'yes' }}
        run: |
          git clone --depth 1 --branch v1.11.1 https://github.com/ninja-build/ninja.git
          cd ninja
          ./../tools/dockcross-cmake-builder.sh ${{ matrix.arch_name.image }} ${{ matrix.arch_name.ninja_arg }}

      # Updated on 04/04/2025 (Use openSSL_1_1_1w to fix error: implicit declaration of function 'memcmp')
      - name: openssl build test
        if: ${{ matrix.arch_name.openssl == 'yes' }}
        run: |
          git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git
          cd openssl
          wget https://raw.githubusercontent.com/mavlink/MAVSDK/17ad598f0e004d225f5e939aa2947a95791f2f9b/cpp/third_party/openssl/dockcross-android.patch
          patch -p 0 < dockcross-android.patch
          ./../tools/dockcross-command.sh ${{ matrix.arch_name.image }} ./Configure ${{ matrix.arch_name.openssl_arg }}
          ./../tools/dockcross-make-builder.sh ${{ matrix.arch_name.image }} -j${nproc}
          cd ..
          rm -rf openssl

      # Updated on 12/09/2022
      - name: C build test
        if: ${{ matrix.arch_name.C == 'yes' }}
        run: |
          git clone https://github.com/TheAlgorithms/C.git
          cd C
          git checkout b0a41bb38c67ddebb31d3fe06d11e171410c3379
          ./../tools/dockcross-cmake-builder.sh ${{ matrix.arch_name.image }} ${{ matrix.arch_name.C_arg }}
          cd ..
          rm -rf C

      # Updated on 12/09/2022
      - name: fmt build test
        if: ${{ matrix.arch_name.fmt == 'yes' }}
        run: |
          git clone --depth 1 --branch 9.1.0 https://github.com/fmtlib/fmt.git
          cd fmt
          ./../tools/dockcross-cmake-builder.sh ${{ matrix.arch_name.image }} ${{ matrix.arch_name.fmt_arg }} -DFMT_DOC=OFF
          cd ..
          rm -rf fmt

      # Updated on 19/05/2022
      - name: cpython build test
        if: ${{ matrix.arch_name.cpython == 'yes' }}
        run: |
          git clone --depth 1 --branch v3.11.2 https://github.com/python/cpython.git
          cd cpython
          ./../tools/dockcross-command.sh ${{ matrix.arch_name.image }} ./configure ac_cv_file__dev_ptmx=no ac_cv_file__dev_ptc=no --disable-ipv6 ${{ matrix.arch_name.cpython_arg }} --build=x86_64-linux-gnu --with-build-python --enable-shared
          ./../tools/dockcross-make-builder.sh ${{ matrix.arch_name.image }} -j${nproc}
          cd ..
          rm -rf cpython

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: deploy-not-multi-arch
        if: github.ref == 'refs/heads/master'
        run: |
            make ${{ matrix.arch_name.image }}.push
